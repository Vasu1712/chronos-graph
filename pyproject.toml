[project]
name = "chronos-graph"
version = "0.1.0"
description = "Local, persistent, bi-temporal memory for multi-session conversational agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",              # client for Ollama's OpenAI-compatible endpoint, Groq, Cerebras
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "typer>=0.12",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
chronos = "chronos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: hits a real model or network endpoint (run with -m live)",
    "data: requires downloaded datasets in data/raw (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/chronos/cli.py" = ["B008"]  # typer.Option/Argument defaults are the typer idiom
